plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    // Apply SpotBugs plugin for static analysis
    id 'com.github.spotbugs' version '6.0.25'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // This dependency is used by the application.
    implementation libs.guava
    
    // ApprovalTests for snapshot testing
    testImplementation libs.approvaltests
    // Tools to rewrite java code
    testImplementation 'com.github.javaparser:javaparser-symbol-solver-core:3.27.1'
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit Jupiter test framework
            useJUnitJupiter('5.12.1')
        }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'ggen.CLI'
}

run {
    workingDir = project.rootDir
}

// Configure SpotBugs
spotbugs {
    toolVersion = '4.8.6'
    ignoreFailures = true
    showStackTraces = true
    showProgress = true
    effort = 'min'
    reportLevel = 'high'
}

// Only run SpotBugs on main source set, not tests
spotbugsMain {
    enabled = true
    reports {
        html {
            required = true
        }
    }
}

spotbugsTest {
    enabled = false
}
