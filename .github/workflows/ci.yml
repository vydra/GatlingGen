name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build project
      run: ./gradlew build
      
    - name: Run tests
      run: ./gradlew test
      
    - name: Run SpotBugs static analysis
      run: ./gradlew spotbugsMain
      
    - name: Check SpotBugs results
      run: |
        if [ -f "app/build/reports/spotbugs/main.html" ]; then
          echo "SpotBugs report generated successfully"
        else
          echo "SpotBugs report not found"
          exit 1
        fi
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: app/build/test-results/
        
    - name: Upload SpotBugs reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spotbugs-reports
        path: app/build/reports/spotbugs/
        
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: app/build/reports/tests/
        
    - name: Build summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Java Version**: 21" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Test Results**: Available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- **SpotBugs Analysis**: Available in artifacts" >> $GITHUB_STEP_SUMMARY
        if [ -f "app/build/reports/spotbugs/main.html" ]; then
          echo "- **SpotBugs Report**: ✅ Generated" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **SpotBugs Report**: ❌ Not found" >> $GITHUB_STEP_SUMMARY
        fi
